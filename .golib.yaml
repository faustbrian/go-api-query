schema_version: 1
tool_version: v1.0.14
tool_checksums_sha256: 88341d2f2904925b22ec8de084fec68c5229669f1119f066ed5fccd76aee2f82
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v1.txt
operations:
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: postgres
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzCompileFilterExpression$'
        budget: 5s
        timeout: 2m
      - type: go-test
        packages: [./apiqueryhttp]
        fuzz: '^FuzzParse$'
        budget: 5s
        timeout: 2m
      - type: go-test
        packages: [./apiqueryrpc]
        fuzz: '^FuzzParse$'
        budget: 5s
        timeout: 2m
      - type: go-test
        packages: [./cursor]
        fuzz: '^FuzzDecode$'
        budget: 5s
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 1s
        timeout: 20m
