schema_version: 1
tool_version: v1.8.5
tool_checksums_sha256: 57f81a14b32fa629f9ed5c9cc6edc62c171095f5da6e36fa989dc12442fe1983
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v4.txt
operations:
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: postgres
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzCompileFilterExpression$'
        budget: 5s
        timeout: 2m
      - type: go-test
        packages: [./apiqueryhttp]
        fuzz: '^FuzzParse$'
        budget: 5s
        timeout: 2m
      - type: go-test
        packages: [./adapters/http]
        fuzz: '^FuzzParse$'
        budget: 5s
        timeout: 2m
      - type: go-test
        packages: [./apiqueryrpc]
        fuzz: '^FuzzParse$'
        budget: 5s
        timeout: 2m
      - type: go-test
        packages: [./adapters/jsonrpc]
        fuzz: '^FuzzParse$'
        budget: 5s
        timeout: 2m
      - type: go-test
        packages: [./cursor]
        fuzz: '^FuzzDecode$'
        budget: 5s
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 1s
        timeout: 20m
